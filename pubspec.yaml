name: eng_friend
description: "한국말 잘하는 미국인 친구 - AI 영어 학습 앱"
publish_to: 'none'
version: 2.5.0+25

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0

  # Voice
  # 7.4.0부터 Android에 pauseFor를 실제로 넘겨 세션 종료 타이밍이 바뀐다. 실험 브랜치에서 검증 전까지 7.3.x 고정 (tobe.md V-12)
  speech_to_text: '>=7.3.0 <7.4.0'
  flutter_tts: ^4.2.0
  record: ^6.0.0

  # Local Storage
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.4

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Ads
  google_mobile_ads: ^5.3.0

  # Utils
  uuid: ^4.5.1
  path_provider: ^2.1.5
  path: ^1.9.1
  url_launcher: ^6.3.1
  lottie: ^3.3.2
  dotlottie_loader: ^0.0.5
  audio_session: ^0.2.4
  # 13+ 로 올리지 말 것: permission_handler_android 14는 android/build.gradle.kts에서
  # 최상위 kotlin { compilerOptions {} } DSL을 쓰는데, 이 프로젝트 빌드에서
  # 해당 확장이 해석되지 않아 "Unresolved reference: compilerOptions"로 빌드가 깨진다.
  # 12.x의 android 모듈은 groovy build.gradle이라 안전. 쓰는 건 openAppSettings() 하나.
  permission_handler: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  drift_dev: ^2.22.1
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/korean_friend.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/lottie/
    - assets/legal/

  # Pretendard Variable: 다운로드 후 아래 주석 해제 (assets/fonts/README.md 참조)
  # fonts:
  #   - family: Pretendard
  #     fonts:
  #       - asset: assets/fonts/PretendardVariable.ttf
